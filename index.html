<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ZOMBIE SURVIVAL — Platformer</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Share+Tech+Mono&family=Creepster&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/main.css"/>
  <link rel="stylesheet" href="css/hud.css"/>
  <link rel="stylesheet" href="css/screens.css"/>
</head>
<body>

<div id="gameWrapper">
  <canvas id="gameCanvas"></canvas>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hud-block">
    <div class="hud-label">VIDA</div>
    <div id="healthBar"><div id="healthFill"></div></div>
    <div id="healthValue">100</div>
  </div>
  <div class="hud-center">
    <div class="hud-label" id="episodeLabel">EP 1 · NIV 1</div>
    <div id="waveDisplay">OLEADA <span id="waveValue">1</span>/5</div>
  </div>
  <div class="hud-block" style="text-align:right">
    <div class="hud-label">PUNTOS</div>
    <div id="scoreValue" class="hud-value gold">0</div>
  </div>
</div>

<!-- Overlays -->
<div id="hitOverlay"></div>
<div id="waveBanner"></div>
<div id="killFeed"></div>
<div id="bossHPBar" class="hidden">
  <div class="hud-label" id="bossName">BOSS</div>
  <div id="bossBarWrap"><div id="bossFill"></div></div>
</div>

<!-- ── PANTALLA: MENÚ ── -->
<div class="screen" id="screenMenu">
  <div class="screen-bg"></div>
  <div class="screen-content">
    <div class="game-title">ZOMBIE<br>SURVIVAL</div>
    <div class="game-subtitle">PLATFORMER</div>
    <div class="divider"></div>
    <div class="episode-select" id="episodeSelect">
      <button class="ep-btn active" data-ep="1">
        <span class="ep-num">I</span>
        <span class="ep-name">EL CEMENTERIO</span>
        <span class="ep-diff">⭐</span>
      </button>
      <button class="ep-btn" data-ep="2" id="ep2Btn">
        <span class="ep-num">II</span>
        <span class="ep-name">LA CRIPTA</span>
        <span class="ep-diff">⭐⭐</span>
      </button>
      <button class="ep-btn" data-ep="3" id="ep3Btn">
        <span class="ep-num">III</span>
        <span class="ep-name">EL INFIERNO</span>
        <span class="ep-diff">⭐⭐⭐</span>
      </button>
    </div>
    <div class="controls-hint">
      <div class="ctrl"><div class="key">A/D</div><div class="key-desc">Mover</div></div>
      <div class="ctrl"><div class="key">W/↑</div><div class="key-desc">Saltar</div></div>
      <div class="ctrl"><div class="key">J</div><div class="key-desc">Golpear</div></div>
      <div class="ctrl"><div class="key">K</div><div class="key-desc">Patear</div></div>
      <div class="ctrl"><div class="key">W+J</div><div class="key-desc">Salto+Golpe</div></div>
    </div>
    <button class="btn" id="btnPlay">JUGAR</button>
    <div id="bestScoreMenu" class="best-score">RÉCORD: 0</div>
  </div>
</div>

<!-- ── PANTALLA: PAUSA ── -->
<div class="screen hidden" id="screenPause">
  <div class="screen-bg"></div>
  <div class="screen-content">
    <div class="screen-title pause">PAUSA</div>
    <div class="divider"></div>
    <button class="btn" id="btnContinue">CONTINUAR</button>
    <button class="btn btn-sm" id="btnMenuFromPause">MENÚ PRINCIPAL</button>
  </div>
</div>

<!-- ── PANTALLA: NIVEL COMPLETADO ── -->
<div class="screen hidden" id="screenLevelClear">
  <div class="screen-bg green-bg"></div>
  <div class="screen-content">
    <div class="screen-title clear">¡NIVEL SUPERADO!</div>
    <div class="stats-grid" id="levelStats"></div>
    <button class="btn" id="btnNextLevel">SIGUIENTE NIVEL</button>
    <button class="btn btn-sm" id="btnMenuFromClear">MENÚ</button>
  </div>
</div>

<!-- ── PANTALLA: EPISODIO COMPLETADO ── -->
<div class="screen hidden" id="screenEpClear">
  <div class="screen-bg gold-bg"></div>
  <div class="screen-content">
    <div class="screen-title ep-clear" id="epClearTitle">EPISODIO I<br>COMPLETADO</div>
    <div class="divider"></div>
    <button class="btn" id="btnNextEp">SIGUIENTE EPISODIO</button>
    <button class="btn btn-sm" id="btnMenuFromEpClear">MENÚ</button>
  </div>
</div>

<!-- ── PANTALLA: MUERTE ── -->
<div class="screen hidden" id="screenDead">
  <div class="screen-bg"></div>
  <div class="screen-content">
    <div class="screen-title dead">HAS MUERTO</div>
    <div class="stats-grid" id="deadStats"></div>
    <button class="btn" id="btnRetry">REINTENTAR NIVEL</button>
    <button class="btn btn-sm" id="btnMenuFromDead">MENÚ PRINCIPAL</button>
  </div>
</div>

<!-- Scripts en orden de dependencia -->
<script src="js/config.js"></script>
<script src="js/sprites.js"></script>
<script src="js/levels.js"></script>
<script src="js/entities.js"></script>
<script src="js/enemies.js"></script>
<script src="js/bosses.js"></script>
<script src="js/waves.js"></script>
<script src="js/physics.js"></script>
<script src="js/combat.js"></script>
<script src="js/renderer.js"></script>
<script src="js/hud.js"></script>
<script src="js/input.js"></script>
<script src="js/game.js"></script>
</body>
</html>
